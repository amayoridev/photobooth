version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/photobooth
      - JWT_SECRET=super-secret-photobooth-key-change-in-production-2026
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:7.0
    container_name: photobooth_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
